function stages(){let s=get(selected),c=count(s);return `<div class="pagebox"><aside class="panel stage-nav">${data.stages.map((x,i)=>`<button class="${x.id===selected?'active':''}" onclick="selectStage('${x.id}','${tab}')"><span class="step">${i+1}</span><div class="grow"><b>${esc(x.name)}</b><div class="minor">${esc(x.dateLabel||x.date)}</div></div></button>`).join('')}</aside><section style="min-width:0"><div class="panel stage-header"><div class="stage-headtop"><div><div class="kicker">${esc(s.phase)} · 阶段 ${data.stages.indexOf(s)+1}/${data.stages.length}</div><h2>${esc(s.name)}</h2><div class="desc">${esc(s.desc)}</div></div>${tag(s)}</div><div class="summary-line"><span class="tag blue">目标 ${esc(s.dateLabel||s.date)}</span><span class="tag">负责人：${esc(s.owner||'待指定')}</span><span class="tag">已完成 ${c.b}/${c.a} 项</span><button class="btn ghost" onclick="editStage('${s.id}')">编辑阶段信息 ✎</button></div><div class="bar"><i style="width:${c.percent}%"></i></div><div class="minor">总进度 ${c.percent}% · 进度仅表示完成情况，不等于阶段自动放行</div></div><div class="step-tabs">${[['input','① 产品输入'],['output','② 研发输出'],['criteria','③ 验收标准'],['release','④ 放行审批']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('')}</div><div class="panel stage-panel">${tab==='input'?tasks(s,'input'):tab==='output'?tasks(s,'output'):tab==='criteria'?acceptance(s):release(s)}</div><div class="sectiontitle"><h2>本阶段问题（${s.issues.length}）</h2><button class="btn" onclick="addIssue('${s.id}')">＋ 登记问题</button></div><div class="panel pad">${stageIssues(s)}</div></section></div>`}
function setTab(t){tab=t;render()}
function tasks(s,k){let isIn=k==='input',a=s[k];return `<div class="panelhead"><div><h3>${isIn?'产品经理 / 产品部输入':'研发 / 测试输出'}</h3><div class="minor" style="margin-top:5px">${isIn?'提供需求、定义、验收口径，作为研发执行依据':'提交样机、图纸、报告、数据及问题整改证据'}</div></div><span class="tag blue">${a.filter(x=>x.done).length} / ${a.length} 已完成</span></div>${a.map((x,i)=>`<div class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="taskUpdate('${s.id}','${k}',${i},'done',this.checked)" title="标记已完成"><div><b>${esc(x.name)}</b><div class="minor" style="margin-top:5px">${x.done?'已完成交付':'待交付 · 请填写资料位置后勾选完成'}</div><div class="taskdetails"><div class="field"><label>资料地址 / NAS 路径</label><input value="${esc(x.link)}" placeholder="粘贴文件地址或路径" onchange="taskUpdate('${s.id}','${k}',${i},'link',this.value)"></div><div class="field"><label>交付责任人</label><input value="${esc(x.owner)}" placeholder="输入姓名 / 部门" onchange="taskUpdate('${s.id}','${k}',${i},'owner',this.value)"></div></div></div><span class="tag ${x.done?'good':''}">${x.done?'已交付':'待交付'}</span></div>`).join('')}<div class="notice" style="margin-top:14px">操作提示：先填写责任人和文件位置，再勾选交付完成。勾选只是记录交付状态，资料仍需在验收关卡核实。</div>`}
function acceptance(s){return `<div class="panelhead"><div><h3>${esc(s.phase)} 验收检查清单</h3><div class="minor" style="margin-top:5px">请先选择判定，再填写报告编号或可追溯的验证证据</div></div><button class="btn" onclick="addCriteria('${s.id}')">＋ 新增验收项</button></div>${s.criteria.map((x,i)=>`<div class="accept"><div class="accept-row"><h4>${i+1}. ${esc(x.name)}</h4><span class="tag ${x.decision==='通过'&&x.done?'good':x.decision==='不通过'?'bad':'warn'}">${esc(x.decision==='通过'&&x.done?'已通过':x.decision)}</span></div><p>${esc(x.desc)}</p><div class="split"><div class="field"><label>判定结果</label><select onchange="criteriaUpdate('${s.id}',${i},'decision',this.value)">${['待验证','通过','不通过'].map(v=>`<option ${x.decision===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>证据 / 测试报告编号（放行必填）</label><input value="${esc(x.evidence)}" placeholder="例如：DVT-TEST-001 / NAS路径" onchange="criteriaUpdate('${s.id}',${i},'evidence',this.value)"></div></div><label class="minor" style="display:flex;align-items:center;gap:7px;margin-top:5px"><input type="checkbox" ${x.done?'checked':''} onchange="criteriaUpdate('${s.id}',${i},'done',this.checked)"> 该项已复核完成</label></div>`).join('')}<div class="notice">提醒：CNC / DVT / PVT / MP 的量化指标需由项目组评审并批准。填写“通过”不能替代实际测试数据与报告。</div>`}
function release(s){let m=unmet(s),ok=ready(s);return `<div class="panelhead"><div><h3>阶段放行确认</h3><div class="minor" style="margin-top:5px">系统自动检查交付完成、验收结果与阻断问题</div></div>${tag(s)}</div><div class="gate-grid">${[['产品输入缺项',m.in],['研发输出缺项',m.out],['验收未通过 / 缺证据',m.criteria],['阻断问题',m.issues]].map(([label,num])=>`<div class="gategriditem"><div class="minor">${label}</div><strong style="color:${num?'var(--red)':'var(--green)'}">${num}</strong><span class="tag ${num?'bad':'good'}">${num?'待处理':'已满足'}</span></div>`).join('')}</div><div class="gate-banner"><h3>${s.status==='已放行'?'✓ 本阶段已放行':ok?'✓ 已满足放行检查':'目前尚不满足放行条件'}</h3><div class="desc">${s.status==='已放行'?`签核记录：${esc(s.approvedBy)} · ${esc(s.approvedOn)}`:ok?'请核实所有资料真实完整，由具有权限的负责人执行签核。':'请先完成交付资料、验收报告和 P0/P1 问题闭环。'}</div><div class="toolbar" style="margin-top:15px">${s.status==='已放行'?`<button class="btn danger" onclick="revoke('${s.id}')">撤销放行</button>`:`<button class="btn primary" ${ok?'':'disabled'} onclick="approve('${s.id}')">签核并放行阶段 →</button>`}</div></div><div class="minor" style="margin-top:20px">审批说明：单机版本只保存填写的签核姓名和时间，不提供身份认证或不可篡改审计。正式跨部门审批需部署账号权限后台。</div>`}
function stageIssues(s){return s.issues.length?`<div class="table-scroll"><table class="table"><thead><tr><th>问题</th><th>优先级</th><th>责任人</th><th>状态</th><th>操作</th></tr></thead><tbody>${s.issues.map((x,i)=>`<tr><td><b>${esc(x.title)}</b><div class="minor">${esc(x.note)}</div></td><td><span class="tag ${x.severity==='P2'?'':'bad'}">${esc(x.severity)}</span></td><td>${esc(x.owner||'待指定')}</td><td><span class="tag ${x.state==='已关闭'?'good':'warn'}">${esc(x.state)}</span></td><td><button class="btn" onclick="editIssue('${s.id}',${i})">编辑</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">本阶段暂无问题记录。发现异常后请登记优先级、责任人和整改结果。</div>'}
function gates(){let gs=['cnc','dvt','pvt','mp'].map(get).filter(Boolean);return `<div class="sectiontitle"><h2>四大质量阶段门</h2><span class="minor">点击进入验收记录</span></div><div class="gate-grid">${gs.map(s=>`<button class="gategriditem" onclick="selectStage('${s.id}','criteria')"><div class="kicker">${s.phase}</div><strong>${s.criteria.filter(x=>x.done&&x.decision==='通过'&&x.evidence).length} / ${s.criteria.length}</strong><div class="minor">${esc(s.name)}</div><div style="margin-top:12px">${tag(s)}</div></button>`).join('')}</div><div class="sectiontitle"><h2>验收内容一览</h2></div><div class="panel table-scroll"><table class="table"><thead><tr><th>关卡</th><th>检查项</th><th>验收要求</th><th>判定</th><th>查看</th></tr></thead><tbody>${gs.flatMap(s=>s.criteria.map(x=>`<tr><td><b>${s.phase}</b></td><td>${esc(x.name)}</td><td>${esc(x.desc)}</td><td><span class="tag ${x.decision==='通过'&&x.done?'good':x.decision==='不通过'?'bad':''}">${esc(x.decision)}</span></td><td><button class="btn" onclick="selectStage('${s.id}','criteria')">填写 →</button></td></tr>`)).join('')}</tbody></table></div>`}
function issues(){let all=data.stages.flatMap(s=>s.issues.map((x,i)=>({...x,stage:s,index:i}))),arr=['全部','未关闭'].includes(issueFilter)?all:all.filter(x=>x.severity===issueFilter);return `<div class="sectiontitle"><h2>跨阶段问题台账</h2><button class="btn primary" onclick="addIssue('${selected}')">＋ 新增问题</button></div><div class="filterbar">${['全部','P0','P1','P2','未关闭'].map(f=>`<button class="${issueFilter===f?'active':''}" onclick="issueFilter='${f}';render()">${f}</button>`).join('')}</div><div class="panel table-scroll"><table class="table"><thead><tr><th>所属阶段</th><th>问题描述</th><th>等级</th><th>负责人</th><th>处理状态</th><th>操作</th></tr></thead><tbody>${arr.filter(x=>issueFilter!=='未关闭'||x.state!=='已关闭').map(x=>`<tr><td>${esc(x.stage.name)}</td><td><b>${esc(x.title)}</b><div class="minor">${esc(x.note)}</div></td><td><span class="tag ${x.severity==='P2'?'':'bad'}">${x.severity}</span></td><td>${esc(x.owner||'待指定')}</td><td><span class="tag ${x.state==='已关闭'?'good':'warn'}">${x.state}</span></td><td><button class="btn" onclick="editIssue('${x.stage.id}',${x.index})">处理</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">没有符合筛选条件的问题</div></td></tr>'}</tbody></table></div>`}
function settings(){return `<div class="panel pad" style="max-width:900px"><div class="panelhead"><h3>项目资料</h3><span class="tag ${data.status==='已归档'?'warn':'good'}">${esc(data.status)}</span></div><div class="split"><div class="field"><label>项目名称</label><input id="setname" value="${esc(data.name)}" ${data.status==='已归档'?'disabled':''}></div><div class="field"><label>项目编号</label><input id="setcode" value="${esc(data.code)}" ${data.status==='已归档'?'disabled':''}></div><div class="field"><label>项目负责人</label><input id="setowner" value="${esc(data.owner)}" ${data.status==='已归档'?'disabled':''}></div><div class="field"><label>项目类型</label><input id="setcat" value="${esc(data.category)}" ${data.status==='已归档'?'disabled':''}></div></div><div class="field"><label>项目说明</label><textarea id="setdesc" ${data.status==='已归档'?'disabled':''}>${esc(data.description)}</textarea></div><div class="toolbar"><button class="btn primary" ${data.status==='已归档'?'disabled':''} onclick="saveProjectSettings()">保存项目资料</button><button class="btn" onclick="cloneProject('${data.id}')">复制为新项目</button><button class="btn ${data.status==='已归档'?'':'danger'}" onclick="toggleArchive('${data.id}')">${data.status==='已归档'?'恢复项目':'归档项目'}</button></div><div style="height:1px;background:var(--line);margin:24px 0"></div><h3>长期使用与数据安全</h3><div class="helpstack"><div class="helprow"><b>自动保存</b><div class="minor">所有项目共同保存在当前浏览器的本地存储中；不是服务器数据库。</div></div><div class="helprow"><b>完整备份</b><div class="minor">每周至少备份一次，重要阶段放行后再备份，并将 JSON 文件存放 NAS 或企业云盘。恢复备份会覆盖全部项目。</div></div><div class="helprow"><b>多人协作</b><div class="minor">此版本不能让多个同事看到实时一致的数据，也没有真正的账户权限、不可篡改审批日志或附件上传。</div></div></div><div class="toolbar" style="margin-top:18px"><button class="btn" onclick="$('#backup').click()">下载全部项目备份</button><button class="btn" onclick="$('#csv').click()">导出全部项目 CSV</button></div><div class="hint" style="margin-top:16px">最近保存：${new Date(data.updated).toLocaleString('zh-CN')}</div></div>`}
function saveProjectSettings(){if(data.status==='已归档')return;let name=$('#setname').value.trim();if(!name)return alert('项目名称不能为空');Object.assign(data,{name,code:$('#setcode').value.trim(),owner:$('#setowner').value.trim(),category:$('#setcat').value.trim(),description:$('#setdesc').value.trim()});persist();render();notify('项目资料已保存')}
function change(fn){if(data.status==='已归档'){notify('归档项目为只读，请先恢复项目');return}fn();persist();render()}
function taskUpdate(id,k,i,f,v){if(data.status==='已归档')return notify('请先恢复归档项目');if(f==='done'&&v&&!get(id)[k][i].link?.trim()){notify('请先填写资料地址或文件路径');render();return}change(()=>{let s=get(id);s[k][i][f]=v;invalidate(s)})}
function criteriaUpdate(id,i,k,v){if(data.status==='已归档')return notify('请先恢复归档项目');if(k==='done'&&v&&(get(id).criteria[i].decision!=='通过'||!get(id).criteria[i].evidence?.trim())){notify('请先选择「通过」并填写验证证据');render();return}change(()=>{let s=get(id);s.criteria[i][k]=v;if(k==='decision'&&v!=='通过')s.criteria[i].done=false;invalidate(s)})}
function invalidate(s){if(s.status==='已放行'){s.status='进行中';s.approvedBy='';s.approvedOn='';notify('交付或验收变更，已自动撤销原放行状态')}}
function modal(inner,ok){$('#modal').innerHTML=`<div class="modalbg"><div class="modal">${inner}<div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="confirmModal">保存</button></div></div></div>`;$('#confirmModal').onclick=ok}
function closeModal(){$('#modal').innerHTML=''}
function editStage(id){if(data.status==='已归档')return notify('请先恢复归档项目');let s=get(id);modal(`<h3>阶段基础信息</h3><div class="field"><label>目标日期</label><input type="date" id="mdate" value="${esc(s.date)}"></div><div class="field"><label>阶段负责人</label><input id="mowner" value="${esc(s.owner)}" placeholder="例如：产品经理 / 项目负责人"></div><div class="field"><label>执行状态</label><select id="mstatus">${['未开始','进行中','阻塞'].map(v=>`<option ${v===s.status?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>阶段说明与待决策事项</label><textarea id="mnotes">${esc(s.notes)}</textarea></div>`,()=>{s.date=$('#mdate').value;s.owner=$('#mowner').value.trim();s.notes=$('#mnotes').value;s.status=s.status==='已放行'?'已放行':$('#mstatus').value;persist();closeModal();render();notify('阶段信息已保存')})}
function addCriteria(id){if(data.status==='已归档')return notify('请先恢复归档项目');modal(`<h3>新增验收项</h3><div class="field"><label>验收名称</label><input id="cname" placeholder="例如：充电温升验证"></div><div class="field"><label>判定标准</label><textarea id="cdesc" placeholder="写明测试方法、样本量及合格条件"></textarea></div>`,()=>{let n=$('#cname').value.trim(),d=$('#cdesc').value.trim();if(!n||!d)return alert('请填写名称和标准');change(()=>{let s=get(id);s.criteria.push({name:n,desc:d,done:false,decision:'待验证',evidence:''});invalidate(s)});closeModal()})}
function issueForm(s,i){if(data.status==='已归档')return notify('请先恢复归档项目');let o=i===undefined?{title:'',severity:'P1',state:'待处理',owner:'',note:''}:s.issues[i];modal(`<h3>${i===undefined?'登记项目问题':'更新问题记录'}</h3><div class="field"><label>问题描述</label><input id="ititle" value="${esc(o.title)}" placeholder="简短明确描述异常"></div><div class="split"><div class="field"><label>优先级</label><select id="iseverity">${['P0','P1','P2'].map(v=>`<option ${v===o.severity?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>处理状态</label><select id="istate">${['待处理','处理中','待复测','已关闭'].map(v=>`<option ${v===o.state?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>责任人</label><input id="iowner" value="${esc(o.owner)}" placeholder="责任人"></div><div class="field"><label>整改方案 / 复测证据</label><textarea id="inote" placeholder="记录原因、整改计划、复测结果与证据">${esc(o.note)}</textarea></div>`,()=>{let title=$('#ititle').value.trim(),owner=$('#iowner').value.trim(),note=$('#inote').value.trim(),state=$('#istate').value;if(!title)return alert('请填写问题描述');if(state==='已关闭'&&!note)return alert('关闭问题时请记录整改及复测结果');let obj={title,owner,note,state,severity:$('#iseverity').value};change(()=>{if(i===undefined)s.issues.push(obj);else Object.assign(s.issues[i],obj);invalidate(s)});closeModal()})}
function addIssue(id){issueForm(get(id))}function editIssue(id,i){issueForm(get(id),i)}
function approve(id){if(data.status==='已归档')return notify('请先恢复归档项目');let s=get(id);if(!ready(s)){notify('请先完成所有放行检查');return}modal(`<h3>确认阶段放行</h3><p class="desc">阶段：${esc(s.name)}。已通过系统基础检查，请确保所有交付与报告均已由负责人核实。</p><div class="field"><label>签核人 / 职务</label><input id="approver" placeholder="例如：质量负责人 张三"></div><div class="notice">单机版本仅记录签核文本，不能代替正式公司审批系统。</div>`,()=>{let who=$('#approver').value.trim();if(!who)return alert('请填写签核人');s.status='已放行';s.approvedBy=who;s.approvedOn=new Date().toLocaleString('zh-CN');persist();closeModal();render();notify('阶段已记录放行')})}
function revoke(id){if(!confirm('撤销本阶段放行？'))return;change(()=>{let s=get(id);s.status='进行中';s.approvedBy='';s.approvedOn=''})}
function resetAll(){alert('为了避免误删，V3 不再提供一键清空所有项目。需要移除单个项目，请在项目组合中执行删除。')}
function download(filename,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('#backup').onclick=()=>download('ADVC_全部项目备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(store,null,2),'application/json');
$('#restore').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj?.schema===3&&Array.isArray(obj.projects)&&obj.projects.length&&obj.projects.every(p=>p.id&&Array.isArray(p.stages))){if(confirm('将用备份覆盖当前全部项目，建议先备份现有数据。确定继续？')){store=obj;store.projects.forEach(normalizeProject);data=store.projects.find(p=>p.id===store.activeId)||store.projects[0];store.activeId=data.id;selected=data.stages[0]?.id||'cnc';persist();go('portfolio');notify('已恢复完整项目组合')}}else if(Array.isArray(obj?.stages)&&obj.stages.length){if(confirm('检测到旧版单项目备份。是否作为一个新项目导入（不会覆盖现有项目）？')){normalizeProject(obj);obj.id=uid();obj.code=obj.code||'IMPORTED';store.projects.push(obj);data=obj;store.activeId=obj.id;selected=obj.stages[0]?.id||'cnc';persist();go('overview');notify('旧版项目已导入')}}else throw Error('不是可识别的项目备份')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};
$('#csv').onclick=()=>{let rows=[['项目编号','项目','项目状态','阶段','目标日期','类别','名称','状态','文件或证据','责任人']];for(const p of store.projects)for(const s of p.stages){for(const t of ['input','output'])for(const x of s[t])rows.push([p.code,p.name,p.status,s.name,s.date,t==='input'?'产品输入':'研发测试输出',x.name,x.done?'已交付':'待交付',x.link,x.owner]);for(const x of s.criteria)rows.push([p.code,p.name,p.status,s.name,s.date,'验收',x.name,x.decision,x.evidence,s.owner]);for(const x of s.issues)rows.push([p.code,p.name,p.status,s.name,s.date,'问题',x.title,x.severity+' / '+x.state,x.note,x.owner])}download('ADVC_全部项目台账.csv','\\ufeff'.replace('\\ufeff','\ufeff')+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></body></html>
